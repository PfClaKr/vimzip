name: build

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: alpine:3
    steps:
      - run: apk add --no-cache build-base coreutils curl git ncurses tar xz zip
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: ./build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: vimzip-linux-x86_64
          path: dist/vimzip-linux-x86_64.*
      - id: tag
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "tag=$(date -u +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          { echo '```'; cat versions.env; echo '```'; } > notes.md
      - if: steps.tag.outputs.tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: notes.md
          files: |
            dist/vimzip-linux-x86_64.zip
            dist/vimzip-linux-x86_64.tar.gz
          make_latest: true
