name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: alpine:3
    steps:
      - run: apk add --no-cache build-base coreutils curl git ncurses tar xz zip
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: ./build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: vimzip-linux-x86_64
          path: dist/vimzip-linux-x86_64.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/vimzip-linux-x86_64.zip
