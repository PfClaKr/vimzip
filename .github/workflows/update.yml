name: update

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    container: alpine:3
    steps:
      - run: apk add --no-cache build-base coreutils curl git ncurses tar xz zip
      - uses: actions/checkout@v7
        with:
          submodules: true
      - id: bump
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/update-versions.sh
          git diff --quiet versions.env || echo changed=1 >> "$GITHUB_OUTPUT"
      - if: steps.bump.outputs.changed
        run: ./build.sh
      - if: steps.bump.outputs.changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update-versions
          commit-message: 'chore: bump tool versions'
          title: 'chore: bump tool versions'
          body: 'Bump versions.env to the latest tags (build passed)'
          add-paths: versions.env
          delete-branch: true
